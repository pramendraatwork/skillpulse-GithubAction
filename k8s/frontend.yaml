apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillpulse-frontend
  namespace: skillpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillpulse-frontend
  template:
    metadata:
      labels:
        app: skillpulse-frontend
    spec:
      containers:
      - name: frontend
        image: skillpulse-skillpulse-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: skillpulse-frontend
  namespace: skillpulse
spec:
  type: NodePort
  selector:
    app: skillpulse-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
