apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: skillpulse
data:
  POSTGRES_DB: skillpulse
  POSTGRES_USER: skillpulse
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: skillpulse
type: Opaque
stringData:
  POSTGRES_PASSWORD: skillpulse123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: skillpulse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: skillpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        envFrom:
        - configMapRef:
            name: postgres-config
        - secretRef:
            name: postgres-secret
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "skillpulse"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: skillpulse
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 
